[project]
name = "whisper-api"
version = "2.0.0"
description = "OpenAI-compatible local Speech-to-Text API using Whisper"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "debasmitr", email = "debasmitr@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
whisper-api-server = "whisper_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
