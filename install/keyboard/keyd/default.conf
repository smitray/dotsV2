[ids]
*

[global]
overload_tap_timeout = 200

[main]
# Home row mods (left hand: A=Meta, S=Alt, D=Shift, F=Ctrl)
# (right hand: J=Ctrl, K=Shift, L=Alt, ;=Meta)
# Using overloadt2 for better tap/hold detection
a = overloadt2(meta_a, a, 180)
s = overloadt2(alt_s, s, 180)
d = overloadt2(shift_d, d, 180)
f = overloadt2(ctrl_f, f, 180)
j = overloadt2(ctrl_j, j, 180)
k = overloadt2(shift_k, k, 180)
l = overloadt2(alt_l, l, 180)
semicolon = overloadt2(meta_semi, semicolon, 180)

# Shift key overrides
leftshift = esc
rightshift = backspace

# Number row: tap for number, hold for shifted symbol
# Using overload() with symbols layer
grave = overload(symbols, grave)
1 = overload(symbols, 1)
2 = overload(symbols, 2)
3 = overload(symbols, 3)
4 = overload(symbols, 4)
5 = overload(symbols, 5)
6 = overload(symbols, 6)
7 = overload(symbols, 7)
8 = overload(symbols, 8)
9 = overload(symbols, 9)
0 = overload(symbols, 0)
minus = overload(symbols, minus)
equal = overload(symbols, equal)

# Apostrophe: tap for ', hold for : (colon)
apostrophe = overload(symbols, apostrophe)

# Bottom row: tap for symbol, hold for shifted symbol
comma = overload(symbols, comma)
dot = overload(symbols, dot)
slash = overload(symbols, slash)

[symbols]
# Shifted symbols for the number row and bottom row
# Activated by holding the key in [main] layer
grave = S-grave      # ~
1 = S-1              # !
2 = S-2              # @
3 = S-3              # #
4 = S-4              # $
5 = S-5              # %
6 = S-6              # ^
7 = S-7              # &
8 = S-8              # *
9 = S-9              # (
0 = S-0              # )
minus = S-minus      # _
equal = S-equal      # +
apostrophe = S-semicolon   # : (colon)
comma = S-comma      # <
dot = S-dot          # >
slash = S-slash      # ?

# Layer toggles
rightalt = toggle(code)
rightcontrol = oneshot(power)
compose = toggle(num)
capslock = toggle(tools)
leftcontrol = oneshot(fzf)   # Hold LCtrl for FZF utilities

# Home row mod layers - these act as modifiers
[meta_a:M]
[alt_s:A]
[shift_d:S]
[ctrl_f:C]
[ctrl_j:C]
[shift_k:S]
[alt_l:A]
[meta_semi:M]

[fzf]
# FZF Layer - RG, FD, Zoxide utilities
# Trigger: Hold LeftControl (oneshot) or Tab from tools layer

# ==================== ZOXIDE / DIRECTORY JUMPING ====================
j = C-j         # fzcd - jump to directory
z = C-z         # zoxide jump fallback

# ==================== FILE SEARCH (FD + RG) ====================
f = C-f         # fzfind - file search with preview
g = C-g         # fzfind with content search (rg)
r = C-r         # rg search mode

# ==================== GIT OPERATIONS ====================
b = C-b         # fzgit branch
l = C-l         # fzgit log
s = C-s         # fzgit status/stash
c = C-c         # fzgit commit
w = C-w         # fzgit worktree

# ==================== HISTORY & SHELL ====================
h = C-h         # fzhist - command history
m = C-m         # man pages with fzf

# ==================== COMBO ACTIONS ====================
# Number row: quick access to specific searches
1 = C-1         # Find and edit recent files
2 = C-2         # Search in current project
3 = C-3         # Git files changed
4 = C-4         # Jump to project root

# Arrow keys for navigation within fzf results
up = up
down = down
left = left
right = right

# Exit layer
esc = toggle(fzf)
leftcontrol = toggle(fzf)
tab = toggle(fzf)

[code]
# CODE Layer - IDE/Neovim commands
# Trigger: RightAlt (toggle mode)

# F-keys for debugging
1 = f5
2 = f9
3 = f10
4 = f11
5 = f12

# Navigation within editor
g = M-C-g
a = home
e = end
s = pageup
d = pagedown

# IDE commands
6 = M-S-p
7 = M-p
8 = M-S-f
9 = M-b

# LSP features
i = M-i
o = M-S-o

# More IDE shortcuts
apostrophe = M-apostrophe
leftbrace = M-leftbrace
rightbrace = M-rightbrace
backslash = M-f

# Terminal multiplexer (tmux) shortcuts
b = C-b
t = C-t
w = C-w
n = C-n
p = C-p

# Search and edit
x = M-x
r = M-r
f = M-f
h = M-S-f
u = M-u

# Code navigation
comma = M-comma
slash = M-slash

# Vim-specific
semicolon = esc
c = M-S-d
v = M-S-v
z = M-z
space = esc

# Window management
j = M-j
k = M-k
l = M-l

# Workspace switching
y = S-1

# Move windows
m = S-M-j

# Exit layer
esc = toggle(code)
rightalt = toggle(code)

[power]
# POWER Layer - System/Window Management
# Trigger: RightControl (oneshot/toggle)

# Workspace switching (1-0 keys)
1 = M-1
2 = M-2
3 = M-3
4 = M-4
5 = M-5
6 = M-6
7 = M-7
8 = M-8
9 = M-9
0 = M-0

# Window focus directionals
h = M-h
j = M-j
k = M-k
l = M-l

# Window move (with Shift)
z = S-M-h
x = S-M-j
c = S-M-k
v = S-M-l

# Window lifecycle
q = M-q
f = M-f
n = M-S-space

# Window manipulation
t = M-t
g = M-g
b = M-b
d = M-d

# Screenshot utilities
s = M-C-s
p = M-S-p

# Application launchers
e = M-e
r = M-r
w = M-w
m = M-m
u = M-u
o = M-o
i = M-i
a = M-a

# Search utilities
slash = M-slash

# Workspace management extras
equal = M-equal
minus = M-minus
comma = M-comma

# Exit layer
esc = toggle(power)
rightcontrol = toggle(power)

[num]
# NUM Layer - T9 Phone-style numpad on letter keys
# Trigger: Compose/Menu key (toggle mode)

# Top row: 7 8 9
u = 7
i = 8
o = 9

# Middle row: 4 5 6
j = 4
k = 5
l = 6

# Bottom row: 1 2 3
m = 1
comma = 2

# Space for 0
space = 0

# Operators
slash = kpenter
semicolon = kpplus
p = kpminus
y = kpasterisk
h = kpslash

# Exit layer
esc = toggle(num)
compose = toggle(num)

[tools]
# TOOLS Layer - Quick access to dev tools (tmux, zsh, lf, nvim, opencode, droid)
# Trigger: CapsLock (toggle mode)
# Organized by rows for muscle memory

# ==================== LAUNCHERS (Top row - QWERTY) ====================
t = M-t           # Launch Terminal (with tmux)
n = M-r           # Launch Neovim
f = M-e           # Launch lf file manager
o = M-o           # Launch OpenCode
d = M-d           # Launch Droid

# ==================== TMUX WINDOWS (Number row) ====================
1 = C-b+1
2 = C-b+2
3 = C-b+3
4 = C-b+4
5 = C-b+5
6 = C-b+6
7 = C-b+7
8 = C-b+8
9 = C-b+9
0 = C-b+0

# ==================== TMUX CONTROLS (Home row) ====================
b = C-b           # Send prefix
h = C-b+h         # Pane left
j = C-b+j         # Pane down
k = C-b+k         # Pane up
l = C-b+l         # Pane right
c = C-b+c         # New window
w = C-b+w         # Window list

# ==================== TMUX ACTIONS (Bottom row) ====================
n = C-b+n         # Next window
p = C-b+p         # Previous window
r = C-b+r         # Reload config
s = C-b+s         # Session list
z = C-b+z         # Zoom pane
x = C-b+x         # Kill pane
v = C-b+v         # Split vertical
g = C-b+percent   # Split horizontal
comma = C-b+comma # Rename window
period = C-b+l    # Last window

# ==================== EDITOR/NVIM ====================
a = esc           # Quick Escape
q = C-w+q         # Close window
m = C-o           # Jump back
slash = C-p       # Telescope find files

# ==================== ZSH LINE EDITING ====================
u = C-u           # Clear line
e = C-e           # End of line
minus = C-r       # History search

# ==================== LF FILE MANAGER ====================
space = space     # Toggle selection
enter = enter     # Open file
backspace = q     # Quit

# ==================== FZF UTILITIES ====================
# Hold Tab to access FZF layer (while in tools layer)
tab = toggle(fzf)

# ==================== Exit ====================
esc = toggle(tools)
capslock = toggle(tools)
