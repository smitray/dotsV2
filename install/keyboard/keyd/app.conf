# Application-specific key remappings for keyd
# Copy to: ~/.config/keyd/app.conf

[terminal]
# Terminal-specific Ctrl+C remapping
# Problem: Ctrl+C sends SIGINT, not Copy
# Solution: Swap Ctrl+C with Ctrl+Shift+C in terminal
leftcontrol+c = leftcontrol+shift+c  # Ctrl+C -> Ctrl+Shift+C (Copy)
leftcontrol+shift+c = leftcontrol+c   # Ctrl+Shift+C -> Ctrl+C (SIGINT)

[terminal-emulator]
# General terminal emulator configuration (covers multiple terminal types)
leftcontrol+c = leftcontrol+shift+c  # Ctrl+C -> Ctrl+Shift+C (Copy)
leftcontrol+shift+c = leftcontrol+c   # Ctrl+Shift+C -> Ctrl+C (SIGINT)

[alacritty]
# Alacritty specific
leftcontrol+c = leftcontrol+shift+c
leftcontrol+shift+c = leftcontrol+c

[kitty]
# Kitty terminal specific
leftcontrol+c = leftcontrol+shift+c
leftcontrol+shift+c = leftcontrol+c

[foot]
# Foot terminal specific
leftcontrol+c = leftcontrol+shift+c
leftcontrol+shift+c = leftcontrol+c

[gnome-terminal]
# GNOME Terminal specific
leftcontrol+c = leftcontrol+shift+c
leftcontrol+shift+c = leftcontrol+c

[foot]
# Foot terminal specific (for Wayland compatibility)
leftcontrol+c = leftcontrol+shift+c
leftcontrol+shift+c = leftcontrol+c

