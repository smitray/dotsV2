# Hyprland configuration snippet for FZF utilities
# Add these bindings to your hyprland.conf or import this file
# These match the keyd FZF layer keybindings

# ==================== FZF UTILITIES ====================
# These bind to the keyd FZF layer key combos

# zoxide directory jumping
bind = CTRL, J, exec, kitty --class fzcd -e bash -c 'fzcd && exec bash'
bind = CTRL SHIFT, J, exec, kitty -e bash -c 'cd "$(fzcd)" && exec bash'

# File search with fd/rg
bind = CTRL, F, exec, kitty --class fzfind -e bash -c 'file=$(fzfind); [ -n "$file" ] && nvim "$file"'
bind = CTRL, G, exec, kitty --class fzfind -e bash -c 'read -p "Search pattern: " pattern; file=$(fzfind -r "$pattern"); [ -n "$file" ] && nvim "$file"'

# Git operations
bind = CTRL, B, exec, kitty --class fzgit -e bash -c 'fzgit branch'
bind = CTRL, L, exec, kitty --class fzgit -e bash -c 'fzgit log'
bind = CTRL, S, exec, kitty --class fzgit -e bash -c 'fzgit status'
bind = CTRL SHIFT, S, exec, kitty --class fzgit -e bash -c 'fzgit stash'
bind = CTRL, C, exec, kitty --class fzgit -e bash -c 'fzgit commit'
bind = CTRL, W, exec, kitty --class fzgit -e bash -c 'fzgit worktree'

# History search
bind = CTRL, H, exec, kitty --class fzhist -e bash -c 'cmd=$(fzhist); [ -n "$cmd" ] && eval "$cmd"'

# Additional useful bindings (not in FZF layer but related)
# Direct rg search with preview
bind = CTRL SHIFT, F, exec, kitty -e bash -c 'read -p "Search pattern: " pattern; [ -n "$pattern" ] && rg --color=always "$pattern" . 2>/dev/null | fzf --ansi --preview "echo {}" --preview-window down:3'

# Quick zoxide jump to common directories
bind = CTRL, 1, exec, kitty -e bash -c 'cd "$(zoxide query -l | head -1)" && exec bash'
bind = CTRL, 2, exec, kitty -e bash -c 'cd "$(zoxide query -l | head -2 | tail -1)" && exec bash'
bind = CTRL, 3, exec, kitty -e bash -c 'cd "$(zoxide query -l | head -3 | tail -1)" && exec bash'

# ==================== WINDOW RULES ====================
# Make fzf windows floating and centered
windowrulev2 = float,class:^(fzcd|fzfind|fzgit|fzhist)$
windowrulev2 = size 1200 800,class:^(fzcd|fzfind|fzgit|fzhist)$
windowrulev2 = center,class:^(fzcd|fzfind|fzgit|fzhist)$
windowrulev2 = opacity 0.95,class:^(fzcd|fzfind|fzgit|fzhist)$
